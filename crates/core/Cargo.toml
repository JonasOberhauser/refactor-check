[package]
name = "refactor-check-core"
version = "4.1.0"
edition = "2021"

[dependencies]
async-openai = { version = "0.36", features = ["chat-completion"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
dashmap = "6"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = "0.3"
rustyline = "14"
ratatui = "0.28"
tui-input = "0.10"
crossterm = "0.28"
servyi-ioprovider = { git = "https://github.com/servyi/ioprovider.git", branch = "main" }