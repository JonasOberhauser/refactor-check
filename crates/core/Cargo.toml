[package]
name = "refactor-check-core"
version = "4.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json", "charset"] }
tracing = "0.1"
dashmap = "6"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = "0.3"
servyi-ioprovider = { git = "https://github.com/servyi/ioprovider.git", branch = "main" }
servyi-states = { git = "https://github.com/servyi/states.git", branch = "main" }
servyi-servatui = { git = "https://github.com/servyi/servatui.git", branch = "main" }
servatui-display = { git = "https://github.com/servyi/servatui.git", branch = "main" }
ratatui = { version = "0.28", features = ["unstable-widget-ref"] }
crossterm = "0.28"
[dev-dependencies]
tempfile = "3"

[features]
# Fan-out children take turns in child order instead of running in parallel,
# so a fuzz input drives the shared provider stream deterministically.
sequential-fanout = []
