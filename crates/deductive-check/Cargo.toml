[package]
name = "deductive-check"
version = "0.1.0"
edition = "2021"

[dependencies]
refactor-check-core = { path = "../core" }
async-openai = { version = "0.36", features = ["chat-completion"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dashmap = "6"