[package]
name = "deductive-check-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
deductive-check = { path = ".." }
refactor-check-core = { path = "../../core" }
servyi-ioprovider = { git = "https://github.com/servyi/ioprovider.git", branch = "main" }
arbitrary = "1"
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["rt"] }
tempfile = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "state_machine"
path = "fuzz_targets/state_machine.rs"
test = false
doc = false

[[bin]]
name = "formula_extraction"
path = "fuzz_targets/formula_extraction.rs"
test = false
doc = false
