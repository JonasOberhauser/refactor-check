[package]
name = "deductive-shell"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deductive-shell"
path = "src/main.rs"

[dependencies]
refactor-check-core = { path = "../core" }
servyi-servatui = { git = "https://github.com/servyi/servatui.git", branch = "main" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
