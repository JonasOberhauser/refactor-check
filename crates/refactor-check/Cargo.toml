[package]
name = "refactor-check"
version = "4.1.0"
edition = "2021"

[dependencies]
refactor-check-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"

[dev-dependencies]
test-log = { version = "0.2", features = ["trace"] }
refactor-check-test-helpers = { path = "tests/helpers" }